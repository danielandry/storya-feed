name: Atualizar feed
on:
  schedule:
    - cron: '*/30 * * * *'    # a cada 30 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:           # botão "Run workflow", para atualizar na hora
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar docs/feed.json a partir do Substack
        run: node gerar-feed.mjs
      - name: Publicar se mudou
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/feed.json
          git diff --cached --quiet || (git commit -m "Atualiza feed" && git push)
